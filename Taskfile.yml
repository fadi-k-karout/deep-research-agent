version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  sync:
    desc: Sync project dependencies
    cmds:
      - uv sync

  run:
    desc: "Run the deep-research-agent CLI. Extra CLI flags go via CLI_ARGS, e.g. task run -- --tui"
    cmds:
      - uv run deep-research-agent {{.CLI_ARGS}}

  run:tui:
    desc: "Run the deep-research-agent TUI (--tui). Extra flags via CLI_ARGS, e.g. task run:tui -- --max-iterations 10"
    cmds:
      - uv run deep-research-agent --tui {{.CLI_ARGS}}

  test:
    desc: Run all tests (unit then integration)
    cmds:
      - task: test:unit
      - task: test:integration

  test:unit:
    desc: Run unit tests
    cmds:
      - uv run python -m unittest discover -s tests/unit -v

  test:integration:
    desc: Run integration tests (auto-skip when API keys are unset)
    cmds:
      - uv run python -m unittest discover -s tests/integration -v
