[project]
name = "deep-research-agent"
version = "0.1.0"
description = "A stateful deep research agent with dual-layer semantic memory, web search, scraping, and LangGraph orchestration."
readme = "README.md"
authors = [
    { name = "Fadi Karout", email = "fadi@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "tavily-python>=0.8.3",
    "exa-py>=2.21.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    "tenacity>=9.1.4",
    "openai>=3.14.1",
    "textual>=8.2.8",
]

[project.scripts]
deep-research-agent = "deep_research_agent:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
